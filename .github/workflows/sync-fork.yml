name: Fork自动同步上游仓库

on:
  # 北京时间每日凌晨 4 点自动同步
  # GitHub 使用 UTC，因此北京时间 04:00 = UTC 20:00
  schedule:
    - cron: '0 20 * * *'

  # 支持网页手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 必须保留，否则同步 Action 会报：
      # fatal: not a git repository
      - name: Checkout 当前 Fork 仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步上游 FGBLH/HKL main 分支
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: FGBLH/HKL
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          test_mode: false
